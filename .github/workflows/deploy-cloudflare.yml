# Deploy to Cloudflare Pages (frontend only)
#
# P0-1: Automatic Supabase operations on push are REMOVED.
#   - No `supabase db push`, `db diff`, or `functions deploy` in CI.
#   - Deployment to Cloudflare Pages happens on push to main/master, or via
#     manual workflow_dispatch.
#   - Database + Edge Function changes are intentionally NOT applied by this
#     workflow; they must go through an approved, manually-triggered pipeline
#     after schema/function reconciliation (see docs/production_reconciliation_p0_5.md).
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_BACKOFFICE_API_URL: ${{ secrets.VITE_BACKOFFICE_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=abiedienbackoffice
